<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Salmos Diários</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background-color: #ffffff; color: #1a1a1a; font-family: -apple-system, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: space-between; min-height: 100vh; padding: 40px 20px; overflow: hidden; }
    
    /* Cabeçalho de status em preto */
    .status-bar { width: 100%; display: flex; justify-content: space-between; max-width: 400px; font-size: 10px; letter-spacing: 3px; color: #000000; font-weight: 600; }
    
    .header { text-align: center; margin-top: 20px; }
    .header h1 { font-family: 'Cormorant Garamond', serif; font-size: 24px; border-bottom: 1px solid #bf9a5a; padding-bottom: 5px; }
    .header p { font-size: 12px; color: #bf9a5a; letter-spacing: 2px; text-transform: uppercase; }
    
    .frase-container { width: 100%; max-width: 500px; text-align: center; padding: 20px; margin: auto; }
    
    /* Frase principal preta e elegante */
    .frase { font-family: "Cormorant Garamond", serif; font-style: italic; font-size: 24px; color: #1a1a1a; margin-bottom: 20px; font-weight: 300; }
    
    /* Frase reflexão (fade-in) preta e fina */
    .reflexao { font-family: -apple-system, sans-serif; font-size: 14px; color: #000; font-weight: 200; opacity: 0; transition: opacity 2s ease-in; }
    
    /* Rodapé com as informações solicitadas */
    .footer { text-align: center; width: 100%; padding-bottom: 20px; font-size: 8px; color: #999; letter-spacing: 1px; text-transform: uppercase; }
  </style>
</head>
<body>
  <div class="status-bar">
    <span id="relogio">--:--</span>
    <span id="contador-dia">Dia: --</span>
  </div>
  <div class="header">
    <h1>Salmos Diários</h1>
    <p>Sua porção de fé diária</p>
  </div>
  
  <div class="frase-container">
    <p class="frase" id="frase-display">Carregando...</p>
    <p class="reflexao" id="reflexao-display"></p>
  </div>

  <div class="footer">
    <p>Feito com carinho por: MugShopp - Estúdio de Design e Personalizados - Taubaté/SP - (12) 99243.9101</p>
  </div>

  <script>
    async function carregarConteudo() {
      try {
        const [resSalmo, resRef] = await Promise.all([
          fetch('salmo.txt'),
          fetch('reflexoes.txt')
        ]);
        
        const textoSalmo = await resSalmo.text();
        const textoRef = await resRef.text();
        
        const salmos = textoSalmo.split('\n').filter(l => l.trim() !== '');
        const reflexoes = textoRef.split('\n').filter(l => l.trim() !== '');
        
        const agora = new Date();
        const inicio = new Date(agora.getFullYear(), 0, 0);
        const diaDoAno = Math.floor((agora - inicio) / (1000 * 60 * 60 * 24));
        
        document.getElementById('contador-dia').textContent = `Dia: ${diaDoAno}`;
        
        const indice = (diaDoAno - 1) % salmos.length;
        
        document.getElementById('frase-display').textContent = salmos[indice] || "A fé move montanhas.";
        
        setTimeout(() => {
            const refEl = document.getElementById('reflexao-display');
            refEl.textContent = reflexoes[indice] || "Deus está sempre com você.";
            refEl.style.opacity = 1;
        }, 5000);
        
      } catch (e) {
        document.getElementById('frase-display').textContent = "Erro ao carregar arquivos. Verifique se salmo.txt e reflexoes.txt estão na pasta.";
      }
    }
    
    function atualizarRelogio() {
      document.getElementById('relogio').textContent = new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
    }
    
    setInterval(atualizarRelogio, 1000);
    atualizarRelogio();
    carregarConteudo();
  </script>
</body>
</html>
